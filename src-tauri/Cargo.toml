[package]
name = "yokai-shogi"
version = "0.1.0"
description = "妖怪将棋 〜百鬼夜行の盤上決戦〜"
authors = ["nit-games"]
edition = "2021"

[lib]
name = "yokai_shogi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
