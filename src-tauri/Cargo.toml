[package]
name = "yokai-shogi"
version = "0.1.0"
description = "百鬼盤"
authors = ["nit-games"]
edition = "2021"

[lib]
name = "yokai_shogi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamworks = "0.12"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
